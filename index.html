<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<base href="https://cdn.jsdelivr.net/gh/zankhanarana9/Galaxian@33fcddb6fb6bcba26081efeb146f0f522d69ae18/Galaxian/">
<title>RED FOX — GALAXIAN CLASSIC</title>
<link rel="stylesheet" href="Style.css">
<style>
html,body{margin:0;padding:0;width:100%;height:360px;overflow:hidden;background:#000}
body{position:relative;width:600px;height:360px;margin:0 auto;background:#000}
canvas{position:absolute;top:0;left:0}
.level{position:absolute;top:5px;left:8px;z-index:2;color:#ff7f00;font:14px Helvetica,sans-serif}
.time{position:absolute;top:5px;left:180px;z-index:2;color:#ff7f00;font:14px Helvetica,sans-serif}
.score{position:absolute;top:5px;left:480px;z-index:2;color:#ff7f00;font:14px Helvetica,sans-serif}
.game-over,.loading{position:absolute;top:130px;left:210px;z-index:3;color:#ff7f00;font:30px Helvetica,sans-serif}
.game-over{display:none}
.game-over span{font-size:20px;cursor:pointer}
.game-over span:hover{color:#ffd700}
@media(max-width:600px){body{margin:0;transform:scale(calc(100vw / 600));transform-origin:top left}}
</style>
</head>
<body oncontextmenu="return false">
<canvas id="background" width="600" height="360">Ваш браузер не поддерживает Canvas.</canvas>
<canvas id="main" width="600" height="360"></canvas>
<canvas id="ship" width="600" height="360"></canvas>
<div class="level">LEVEL <span id="level">1</span></div>
<div class="time">TIME TAKEN: <span id="times"></span></div>
<div class="score">SCORE: <span id="score"></span></div>
<div class="game-over" id="game-over">GAME OVER<p><span onclick="game.restart()">Restart</span></p></div>
<div class="loading" id="loading">LOADING...<p>Please wait</p></div>
<script src="space_shooter.js"></script>
</body>
</html>
