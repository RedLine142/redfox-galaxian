<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RED FOX ARCADE — GALAXIAN</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030711;color:#eaf6ff;font-family:Arial,sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center}#top{height:38px;min-height:38px;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#091426;border-bottom:1px solid #24476a;font:700 11px monospace;letter-spacing:1px;color:#a8d8ff}#top strong{color:#fff}#top .right{display:flex;align-items:center;gap:9px}button{cursor:pointer;touch-action:manipulation}#fs,#sound{border:1px solid #47749a;border-radius:4px;background:#102b45;color:#dff4ff;padding:6px 8px;font:bold 10px Arial}#stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;background:#02050c;overflow:hidden}canvas{display:block;width:min(100%,calc((100dvh - 112px)*1.333333));height:auto;max-height:100%;aspect-ratio:4/3;object-fit:contain;image-rendering:pixelated;background:#02050c}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;background:rgba(2,5,12,.88);z-index:2;padding:20px}#overlay h1{margin:0;color:#7cecff;font:900 clamp(28px,6vw,54px)/1 monospace;letter-spacing:4px;text-shadow:0 0 12px #168cff,4px 4px #15304f}#overlay .sub{color:#f7d66b;font:bold 13px monospace;letter-spacing:3px}#overlay p{max-width:440px;margin:4px 0;color:#b8cde1;font:12px/1.7 monospace}#overlay button{border:1px solid #8bdfff;background:#123a5a;color:#fff;padding:13px 25px;font:bold 14px monospace;letter-spacing:2px;box-shadow:0 0 16px #147dbb66}#controls{height:74px;min-height:74px;width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#091426;border-top:1px solid #24476a}.pad,.actions{display:flex;align-items:center;gap:10px}#controls button{width:58px;height:54px;border:1px solid #47749a;border-radius:8px;background:linear-gradient(#173c5c,#0c2036);color:#eaf7ff;font-size:22px;font-weight:bold;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 #030a12}#controls button.fire{width:94px;background:linear-gradient(#9d3c32,#5c1d22);border-color:#e48b73;font-size:13px;letter-spacing:1px}#hint{margin:auto;color:#7898b5;font:10px/1.5 monospace;text-align:center}@media(max-width:600px){#top{height:36px;min-height:36px;font-size:9px;padding:0 7px}#fs,#sound{font-size:9px;padding:5px 6px}#controls{height:88px;min-height:88px;padding:8px 10px}.pad,.actions{gap:8px}#controls button{width:58px;height:58px;font-size:23px}#controls button.fire{width:82px;font-size:12px}#hint{display:none}canvas{width:min(100%,calc((100dvh - 124px)*1.333333))}}html:fullscreen,html:fullscreen body{width:100%;height:100%;background:#02050c}html:fullscreen #stage{flex:1}html:fullscreen canvas{max-height:calc(100dvh - 112px)}html:fullscreen #controls{height:74px;min-height:74px}
</style></head><body>
<header id="top"><span>RED FOX ARCADE</span><strong>GALAXIAN</strong><div class="right"><span id="hud">SCORE 000000 · LIVES 3</span><button id="sound" type="button">♫ ON</button><button id="fs" type="button">⛶ НА ВЕСЬ ЭКРАН</button></div></header>
<main id="stage"><canvas id="game" width="640" height="480" aria-label="Игра Galaxian"></canvas><section id="overlay"><div class="sub">RED FOX PRESENTS</div><h1>GALAXIAN</h1><p>Отбивай атаки инопланетного флота. Уничтожай строй, уворачивайся от пикирующих кораблей и защищай галактику.</p><p>← → ДВИЖЕНИЕ<br>ПРОБЕЛ / FIRE — СТРЕЛЬБА</p><button id="start">НАЧАТЬ ИГРУ</button></section></main>
<footer id="controls"><div class="pad"><button data-key="left" aria-label="Влево">◀</button><button data-key="right" aria-label="Вправо">▶</button></div><div id="hint">← → ДВИЖЕНИЕ<br>SPACE — ОГОНЬ</div><div class="actions"><button class="fire" data-key="fire">ОГОНЬ</button></div></footer>
<script>
(function(){
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),hud=document.getElementById('hud'),overlay=document.getElementById('overlay');
const W=640,H=480,keys={left:false,right:false,fire:false},palette=['#ff5b67','#ffb84e','#55e6a5','#5ab8ff'];
let state='menu',score=0,lives=3,wave=1,ship,shots=[],enemyShots=[],enemies=[],particles=[],stars=[],last=0,fireTimer=0,spawnTimer=0,formationX=0,formationDir=1,invuln=0,highScore=0,audio=null,muted=false;
try{highScore=+(localStorage.getItem('rfGalaxianBest')||0)}catch(e){}
const rnd=(a,b)=>a+Math.random()*(b-a);
function sound(freq=440,dur=.07,type='square'){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function initStars(){stars=Array.from({length:125},()=>({x:rnd(0,W),y:rnd(0,H),size:rnd(.5,1.8),speed:rnd(13,48),alpha:rnd(.25,.85)}))}
function newShip(){return{x:W/2-16,y:H-54,w:32,h:25,speed:285}}
function makeFormation(){enemies=[];for(let r=0;r<4;r++)for(let c=0;c<9;c++)enemies.push({x:110+c*52,y:72+r*38,homeX:110+c*52,homeY:72+r*38,row:r,w:27,h:23,phase:rnd(0,6.28),dive:false,diveT:0,fire:rnd(2.5,7),alive:true})}
function updateHud(){hud.textContent='SCORE '+String(score).padStart(6,'0')+' · LIVES '+lives+' · WAVE '+wave}
function startGame(){score=0;lives=3;wave=1;ship=newShip();shots=[];enemyShots=[];particles=[];formationX=0;formationDir=1;fireTimer=0;spawnTimer=0;invuln=1.7;makeFormation();initStars();state='playing';overlay.style.display='none';updateHud();sound(660,.13)}
function endScreen(title,description,button){overlay.innerHTML='<div class="sub">RED FOX ARCADE</div><h1>'+title+'</h1><p>'+description+'</p><p>РЕКОРД: '+String(highScore).padStart(6,'0')+'</p><button id="again">'+button+'</button>';overlay.style.display='flex';document.getElementById('again').addEventListener('click',startGame)}
function explosion(x,y,color){for(let i=0;i<15;i++){const a=rnd(0,Math.PI*2),v=rnd(35,155);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.28,.7),max:.7,color,size:rnd(2,4)})}}
function hitShip(){if(invuln>0||state!=='playing')return;lives--;invuln=1.8;explosion(ship.x+16,ship.y+12,'#72e8ff');enemyShots=[];ship=newShip();updateHud();sound(100,.3,'sawtooth');if(lives<=0){state='over';endScreen('GAME OVER','ТВОЙ СЧЁТ: '+String(score).padStart(6,'0'),'ИГРАТЬ СНОВА')}}
function startOrContinue(){if(state==='menu'||state==='over')startGame();else if(state==='paused'){state='playing';last=performance.now()}else if(state==='clear'){wave++;makeFormation();shots=[];enemyShots=[];formationX=0;formationDir=1;invuln=1.7;state='playing';updateHud()}}
function keyDown(e){if(['ArrowLeft','ArrowRight','Space','Enter','Escape','KeyA','KeyD'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='Space'){keys.fire=true;if(state!=='playing')startOrContinue()}if(e.code==='Enter'){if(state==='playing'){state='paused';document.getElementById('hint').textContent='ПАУЗА · ENTER — ПРОДОЛЖИТЬ'}else startOrContinue()}if(e.code==='Escape'&&state==='playing')state='paused'}
function keyUp(e){if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(e.code==='Space')keys.fire=false}
document.addEventListener('keydown',keyDown);document.addEventListener('keyup',keyUp);window.addEventListener('blur',()=>{keys.left=keys.right=keys.fire=false});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const set=(v,e)=>{if(e)e.preventDefault();keys[k]=v;if(v&&k==='fire'&&state!=='playing')startOrContinue()};b.addEventListener('pointerdown',e=>{b.setPointerCapture?.(e.pointerId);set(true,e)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,e=>set(false,e)));b.addEventListener('contextmenu',e=>e.preventDefault())});
document.getElementById('start').addEventListener('click',startGame);
document.getElementById('sound').addEventListener('click',()=>{muted=!muted;document.getElementById('sound').textContent=muted?'♫ OFF':'♫ ON';if(!muted)sound(700,.08)});
document.getElementById('fs').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){document.getElementById('fs').textContent='НЕДОСТУПНО'}});
document.addEventListener('fullscreenchange',()=>document.getElementById('fs').textContent=document.fullscreenElement?'⤢ ВЫЙТИ':'⛶ НА ВЕСЬ ЭКРАН');
function drawShip(x,y,scale=1){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(scale,scale);ctx.fillStyle='#e8fbff';ctx.fillRect(13,0,6,5);ctx.fillStyle='#64ddff';ctx.fillRect(10,5,12,6);ctx.fillRect(6,11,20,6);ctx.fillStyle='#238dd0';ctx.fillRect(1,17,30,5);ctx.fillStyle='#e8fbff';ctx.fillRect(0,21,32,3);ctx.fillStyle='#ffdc70';ctx.fillRect(13,23,6,5);ctx.restore()}
const sprites=[['00100100','00011000','00111100','01111110','11011011','10100101','00100100'],['00111100','01111110','11111111','11011011','11111111','00100100','01000010'],['00011000','00111100','01111110','11011011','11111111','00100100','01011010'],['00100100','01111110','11111111','11011011','01111110','00100100','01000010']];
function drawEnemy(e){ctx.save();ctx.translate(Math.round(e.x),Math.round(e.y));ctx.fillStyle=palette[e.row];const pat=sprites[e.row],px=3.2,py=3;for(let y=0;y<pat.length;y++)for(let x=0;x<pat[y].length;x++)if(pat[y][x]==='1')ctx.fillRect(Math.round(x*px),y*py,Math.ceil(px),py);ctx.fillStyle='#fff';ctx.fillRect(7,8,3,3);ctx.fillRect(18,8,3,3);ctx.fillStyle='#07111f';ctx.fillRect(8,9,2,2);ctx.fillRect(19,9,2,2);ctx.restore()}
function drawBackground(){ctx.fillStyle='#02050c';ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.alpha;ctx.fillStyle='#c2e5ff';ctx.fillRect(s.x,s.y,s.size,s.size)}ctx.globalAlpha=1;ctx.strokeStyle='#102b48';ctx.beginPath();ctx.moveTo(15,52);ctx.lineTo(W-15,52);ctx.stroke()}
function draw(){drawBackground();ctx.fillStyle='#6dcfff';ctx.font='bold 12px monospace';ctx.textAlign='left';ctx.fillText('SCORE '+String(score).padStart(6,'0'),22,31);ctx.textAlign='center';ctx.fillStyle='#ffcf73';ctx.fillText('WAVE '+wave,W/2,31);ctx.textAlign='right';ctx.fillStyle='#6dcfff';ctx.fillText('SHIPS',W-100,31);for(let i=0;i<lives;i++)drawShip(W-72+i*20,16,.34);
if(state==='menu'){ctx.textAlign='center';ctx.fillStyle='#75dcff';ctx.font='bold 48px monospace';ctx.fillText('GALAXIAN',W/2,174);ctx.fillStyle='#ffcf73';ctx.font='bold 14px monospace';ctx.fillText('RED FOX ARCADE',W/2,204);for(let r=0;r<3;r++)for(let c=0;c<7;c++)drawEnemy({x:W/2-95+c*31,y:238+r*29,row:(r+c)%4});drawShip(W/2-16,377);return}
for(const e of enemies)if(e.alive)drawEnemy(e);ctx.fillStyle='#fff0a0';for(const b of shots)ctx.fillRect(b.x,b.y,3,12);ctx.fillStyle='#ff637b';for(const b of enemyShots){ctx.fillRect(b.x,b.y,4,10);ctx.fillRect(b.x-2,b.y+3,8,3)}if(ship&&(invuln<=0||Math.floor(performance.now()/100)%2===0))drawShip(ship.x,ship.y);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;ctx.strokeStyle='#173754';ctx.beginPath();ctx.moveTo(0,H-18);ctx.lineTo(W,H-18);ctx.stroke();ctx.fillStyle='#52738d';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText('RED FOX • GALAXIAN DEFENSE',12,H-6);
if(state==='paused'||state==='clear'){ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(0,53,W,H-53);ctx.textAlign='center';ctx.fillStyle=state==='clear'?'#ffe17b':'#fff';ctx.font='bold 34px monospace';ctx.fillText(state==='clear'?'ВОЛНА ПРОЙДЕНА!':'ПАУЗА',W/2,225);ctx.font='14px monospace';ctx.fillStyle='#72ddff';ctx.fillText(state==='clear'?'ENTER — СЛЕДУЮЩАЯ ВОЛНА':'ENTER — ПРОДОЛЖИТЬ',W/2,262)}}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){for(const s of stars){s.y+=s.speed*dt;if(s.y>H){s.y=0;s.x=rnd(0,W)}}if(state!=='playing')return;fireTimer=Math.max(0,fireTimer-dt);invuln=Math.max(0,invuln-dt);if(keys.left)ship.x-=ship.speed*dt;if(keys.right)ship.x+=ship.speed*dt;ship.x=Math.max(7,Math.min(W-ship.w-7,ship.x));if(keys.fire&&fireTimer<=0){shots.push({x:ship.x+14,y:ship.y-8,w:4,h:13});fireTimer=.2;sound(560,.045)}
for(let i=shots.length-1;i>=0;i--){shots[i].y-=440*dt;if(shots[i].y<-15)shots.splice(i,1)}formationX+=formationDir*(22+wave*2)*dt;if(formationX>44)formationDir=-1;if(formationX< -44)formationDir=1;spawnTimer-=dt;
for(const e of enemies){if(!e.alive)continue;e.phase+=dt*2.1;if(!e.dive){e.x=e.homeX+formationX+Math.sin(e.phase)*3;e.y=e.homeY+Math.sin(e.phase*.7)*2;e.fire-=dt;if(e.fire<=0&&Math.random()<.2){enemyShots.push({x:e.x+12,y:e.y+e.h,w:4,h:10,v:165+wave*9});e.fire=rnd(3.5,8)}if(spawnTimer<=0&&e.row>=1&&Math.random()<.0014*dt*60){e.dive=true;e.diveT=0;e.diveStartX=e.x;e.diveStartY=e.y;e.diveDir=Math.sign(ship.x-e.x)||1;spawnTimer=rnd(.2,.65)}}else{e.diveT+=dt;e.x=e.diveStartX+Math.sin(e.diveT*3.2)*105+e.diveDir*e.diveT*22;e.y=e.diveStartY+e.diveT*(145+wave*8);if(overlap(e,ship)&&invuln<=0){e.alive=false;explosion(e.x,e.y,palette[e.row]);hitShip()}if(e.y>H+25){e.dive=false;e.homeX=e.x-formationX;e.homeY=rnd(65,180);e.fire=rnd(3,7)}}}
for(let i=enemyShots.length-1;i>=0;i--){const b=enemyShots[i];b.y+=b.v*dt;if(b.y>H){enemyShots.splice(i,1);continue}if(invuln<=0&&overlap(b,ship)){enemyShots.splice(i,1);hitShip()}}
for(let i=shots.length-1;i>=0;i--){let hit=false;for(const e of enemies){if(!e.alive)continue;if(overlap(shots[i],e)){e.alive=false;explosion(e.x+13,e.y+11,palette[e.row]);score+=e.row===0?80:e.row===1?60:e.row===2?50:40;try{if(score>highScore){highScore=score;localStorage.setItem('rfGalaxianBest',highScore)}}catch(err){}updateHud();shots.splice(i,1);sound(220+e.row*90,.08);hit=true;break}}if(hit)continue}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=55*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}if(enemies.every(e=>!e.alive)){state='clear';sound(880,.22);document.getElementById('hint').textContent='ВОЛНА ПРОЙДЕНА · ENTER — ДАЛЬШЕ'}}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
initStars();ship=newShip();makeFormation();requestAnimationFrame(loop);
})();
</script></body></html>
